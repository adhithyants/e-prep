name: Build and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eprep-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, eprep]
    env:
      DEPLOY_PATH: /home/iedc/eprep

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Deploy build locally
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -a --delete dist/ "$DEPLOY_PATH/"
